stages:
  planning:
    agent: codex
    model: gpt-5.6-sol
    reasoning: xhigh
  execution:
    agent: codex
    model: gpt-5.6-sol
    reasoning: low
  repair:
    agent: codex
    model: gpt-5.6-sol
    reasoning: low
  qa:
    agent: codex
    model: gpt-5.6-sol
    reasoning: high
  archive:
    agent: codex
    model: gpt-5.6-sol
    reasoning: low
validation:
  limit: 3
  commands: []
prompts:
  planning: |
{{ prompt "planning" }}
  execution: |
{{ prompt "execution" }}
  repair: |
{{ prompt "repair" }}
  qa: |
{{ prompt "qa" }}
  archive: |
{{ prompt "archive" }}

max_audit_iterations: 3
stages:
  planning:
    agent: codex
    model: gpt-5.6-sol
    reasoning: xhigh
  execution:
    agent: codex
    model: gpt-5.6-sol
    reasoning: medium
  repair:
    agent: codex
    model: gpt-5.6-sol
    reasoning: high
  qa:
    agent: codex
    model: gpt-5.6-sol
    reasoning: high
  archive:
    agent: codex
    model: gpt-5.6-sol
    reasoning: low
validation:
  limit: 3
  commands: []
prompts:
  planning: |
      调用 `oz-plan` 技能开始讨论规划阶段

      规划必须把可演示能力、demo、提交级证据包和审核人员交付报告纳入验收设计：`delivery_report` 用用户语言写清收益、验收步骤、预期结果和直接证据；修复类场景必须绑定可理解且不同的前后证据。`submission_evidence` 把可变 `source_path` 映射到 `tests/evidence/proposals/<change>/**` 下的 `archive_path`；`test-results/**` 只作为可变运行产物。
  execution: |
      读取:

      - `{{.StatePath}}`
      - 以 `state.json.change_name` 为准识别当前 oz change，不要超出当前提案范围
      - acceptance.json：`{{.AcceptancePath}}`

      调用 oz-exec 技能执行当前 oz change: `{{.ChangePath}}/`

      执行完成前必须实际运行能覆盖目标能力的 demo，只产出 `submission_evidence.source_path` 声明的 `test-results/**` 临时证据，交由阶段后置门禁封存为当前 run 的不可变快照。视频、截图、trace 必须是真实可打开的媒体或归档；不得用 echo/printf、硬编码字符串、退出码或测试通过字样冒充用户证据。不得自行写入 `tests/evidence/proposals/<change>/**` 或创建 git commit。
  repair: |
      读取：`{{.StatePath}}`、`{{.AcceptancePath}}`、当前完整变更 `{{.ChangePath}}/`、当前 diff baseline `{{.BaselineHead}}`

      任务：

      - 只处理当前提案范围：检查实现、修正发现的问题并运行确定性验证。
      - 每轮重新核对 state、acceptance、完整 diff 与验证结果；不得仅依赖会话记忆。
      - `pre_qa_audit` 必须实际运行并确认 demo 覆盖目标能力，核对上一检查点的不可变证据快照（如有），只产出 `test-results/**` 临时源并交由本阶段后置门禁封存；不得写入 `tests/evidence/proposals/<change>/**` 提交级证据包。
      - `qa_targeted_repair` 对每个 finding 产出同一用户场景下的修复前失败证据与修复后通过证据，两者必须让审核人员一眼看懂且内容不同；命令输出、退出码、哈希或硬编码字符串不能替代用户可见差异。
      - 每次移交独立 QA 前，按仓库已有的显式入口运行提交前钩子，不得创建临时 commit；吸收改动后，再次运行不再修改文件才可移交。钩子稳定后重新运行受影响测试、全部 required tests 和 validation commands。
      - 执行、自查和定向修复期间不得创建 git commit；完整交付提交只能由归档阶段创建。
      - 当前提案问题写 `findings`；历史债务写 `non_blocking_findings`。
      {{if .HasPreviousRepair}}
      - 上一轮检查点：`{{.LatestPreviousRepairPath}}`。
      {{end}}
      {{if .HasPreviousQA}}
      - 触发本轮的上一轮独立 QA：`{{.LatestPreviousQAPath}}`；必须逐项复核并处理其中的 findings。
      {{end}}
      {{if .IsRepairConfirmation}}
      - 本轮是上一轮 `clean` 后的强制重审确认。必须重新从 state、acceptance、完整 diff 和验证结果开始审查，不得直接复述上一轮结论。
      - 发现任何问题时先修复并使用 `needs_more`；只有本轮未发现新问题、无需新增修改且验证仍通过时才能再次使用 `clean`。
      {{end}}

      写入：`{{.RepairPath}}`

      写入后运行：`oz flow validate-repair --artifact "{{.RepairPath}}" --json`

      严格 JSON：字段为 `summary`、`decision`、`evidence[]`、`findings[]`、`checks`、`non_blocking_findings[]`。
      `decision` 只能是 `clean` 或 `needs_more`。发现并修正问题、仍需下一轮确认时用 `needs_more`；确认当前范围无已知问题时用 `clean`。
      每个 finding 使用 `{title,severity,scope,evidence,recommendation}`。

      同一角色续轮必须复用 backend-scoped 会话 `{{.RoleSessionKey}}`；repairer 不能自行归档，clean 后仍须独立 QA 放行。
  qa: |
      读取：`{{.StatePath}}`、`{{.AcceptancePath}}`、{{if .HasRepairCheckpoint}}`{{.RepairPath}}`、{{else}}本轮未配置 repair 检查点、{{end}}当前完整 diff baseline `{{.BaselineHead}}`、当前变更 `{{.ChangePath}}/`

      任务：

      - 只验收当前提案范围，不修改源码或 `{{.AcceptancePath}}`。
      - 使用独立 QA 会话核对{{if .HasRepairCheckpoint}}最新 repair 检查点{{else}}执行结果（零轮 repair 模式无 repair 检查点）{{end}}；不得继承 repairer 的自我判断。
      - 必须实际复核 demo 覆盖目标能力及当前 run 内封存的 required_evidence 不可变快照；保持只读，不得修改 `test-results/**` 临时源或写入 `tests/evidence/proposals/<change>/**`。{{if .HasRepairCheckpoint}}若本轮验收修复结果，逐项确认每个 finding 同时具有可复现的修复前失败证据与同一场景的修复后通过证据。{{end}}
      - `acceptance_matrix[].id` 必须逐字来自 `{{.AcceptancePath}}` 的 required_tests/required_evidence，并覆盖 acceptance_contract。
      - `user_acceptance[]` 必须逐项覆盖 `delivery_report.scenarios`，用普通用户语言记录实际看到的行为并引用该场景的证据；测试通过、命令输出、退出码、哈希、HTTP 200 或“元素存在”不能作为用户实测结论。
      - 当前提案问题写 `findings`；历史债务或无关问题写 `non_blocking_findings`，scope 用 `out_of_scope_existing`。
      - blocking scope 只允许 `current_change` 或 `introduced_regression`；不得读取可变 `source_path` 判定漂移，也不能把 `test-results/**` 哈希变化当作源码回退信号。

      写入：`{{.QAPath}}`

      写入后运行：`oz flow validate-qa --artifact "{{.QAPath}}" --acceptance "{{.AcceptancePath}}" --json`

      {{if .IsFirstRoleTurn}}
      只写一个 JSON object。

      字段：`summary`、`decision`(0=clean,1=needs_fix)、`evidence[]`、`acceptance_matrix[]`、`user_acceptance[]`、`findings[]`、`non_blocking_findings[]`。

      `acceptance_matrix[]`: `{id,status,artifact,evidence}`；`user_acceptance[]`: `{scenario_id,status,observed,evidence_ids}`，其中 `observed` 必须描述审核人员实际看到的用户结果。`status`: 0=passed, 1=failed。`findings[]`: `{title,severity,scope,evidence,recommendation}`。

      clean：`decision=0`、`findings=[]`、`evidence` 非空、`acceptance_matrix` 覆盖 required_tests/required_evidence、`user_acceptance` 覆盖全部交付场景。needs_fix：`decision=1` 且 `findings` 非空。
      {{else}}
      续轮：复用当前角色会话 `{{.RoleSessionKey}}`，按同 schema 重写 `{{.QAPath}}`。
      {{end}}
  archive: |
      读取：

      - `{{.StatePath}}`
      - `{{.AcceptancePath}}`
      - `{{.PreviousRepairPaths}}`
      - `{{.PreviousQAPaths}}`（如存在）

      执行：

      - 调用 `oz-archive` skill 归档，change-name 见 `state.json.change_name`。
      - 引擎会用最终通过的 QA 实测结论生成 `tests/evidence/proposals/<change>/DELIVERY.md`，并从不可变快照提升 `tests/evidence/proposals/<change>/**` 证据包。归档代理必须以审核人员视角核对报告能说明用户收益、验收步骤、实测结果和直接证据，且证据包没有命中 git ignore；看不懂或打不开的证据不得进入归档提交，也不得从 `test-results/**` 自行复制或重建。
      - 必须从 state 封存的 `delivery_base_head` 新建且只新建一个完整交付 commit，使实现、归档提案与最终证据同属 HEAD；禁止 amend、squash 或沿用执行/自查阶段的提交。

      写入：

      ```text
      {{.DeliverySummaryPath}}
      ```

      该路径是当前 run 的 `delivery-summary.md`。
      summary 包含 `最终审核` 小节。
